# Простой деплой: один Web Service = сайт + API (см. RENDER-ПОШАГОВО.md).
# Netlify не нужен.
services:
  - type: web
    name: voluntis-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm run render-build
    startCommand: node server.js
    healthCheckPath: /api/health
    # Постоянный диск (платный план Render): база не сбрасывается при деплое.
    # disk:
    #   name: voluntis-data
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: npm_config_build_from_source
        value: "sqlite3"
      # Раскомментируйте вместе с disk выше:
      # - key: DATABASE_PATH
      #   value: /var/data/database.sqlite
