# Простой деплой: один Web Service = сайт + API (см. RENDER-ПОШАГОВО.md).
# Netlify не нужен.
services:
  - type: web
    name: voluntis-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm run render-build
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: npm_config_build_from_source
        value: "sqlite3"
      # База в подпапке data (на Render при деплое БД может обнуляться — тогда регистрация заново).
      - key: DATABASE_PATH
        value: /opt/render/project/src/backend/data/database.sqlite
